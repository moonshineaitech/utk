kind = "web"
previewPath = "/"
title = "utk.ai — Unsloppable Tool Kit AI"
version = "1.0.0"
id = "artifacts/utk-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18561

[services.development]
run = "pnpm --filter @workspace/utk-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/utk-ai", "run", "build" ]
publicDir = "artifacts/utk-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18561"
BASE_PATH = "/"
